<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Battle 1v1</title>
  <!-- PeerJS for Direct P2P Multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #F5F5F7;
      --card-bg: #FFFFFF;
      --text-dark: #2B4C81;
      --text-muted: #7A8CA8;
      --grid-border: #3A4D6F;
      --grid-thin: #D6E0EF;
      --cell-bg: #FFFFFF;
      --cell-focus: #8CA8F7;
      --cell-same: #B9C9FF;
      --cell-related: #EBF0FF;
      --accent-blue: #3B82F6;
      --accent-pink: #EC4899;
      --accent-purple: #8B5CF6;
      --accent-mint: #10B981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
    body { background-color: var(--bg-main); color: var(--text-dark); display: flex; justify-content: center; min-height: 100vh; padding: 12px; }
    .app-container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; }

    header { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
    .logo-title { font-size: 1.4rem; font-weight: 800; color: var(--text-dark); display: flex; align-items: center; gap: 6px; }
    .mode-badge { font-size: 0.75rem; font-weight: 700; background: #E2E8F0; color: var(--text-dark); padding: 4px 10px; border-radius: 20px; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--accent-blue); color: white; }
    .btn-secondary { background: #EBF0FF; color: var(--text-dark); }
    .btn-outline { border: 2px solid #D6E0EF; background: transparent; color: var(--text-dark); }

    .sudoku-board { display: grid; grid-template-columns: repeat(9, 1fr); gap: 1px; background: var(--grid-thin); border: 2px solid var(--grid-border); border-radius: 8px; overflow: hidden; aspect-ratio: 1; }
    .cell { background: var(--cell-bg); display: flex; justify-content: center; align-items: center; font-size: 1.4rem; font-weight: 700; color: var(--text-dark); cursor: pointer; position: relative; }
    .cell:nth-child(3n) { border-right: 2px solid var(--grid-border); }
    .cell:nth-child(9n) { border-right: none; }
    .cell-row-end { border-bottom: 2px solid var(--grid-border); }
    
    .cell.given { color: #1E293B; }
    .cell.user-filled { color: var(--accent-blue); }
    .cell.selected { background-color: var(--cell-focus) !important; color: white !important; }
    .cell.same-num { background-color: var(--cell-same); }
    .cell.related { background-color: var(--cell-related); }
    .cell.incorrect { color: #EF4444; }

    .notes-grid { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; padding: 2px; }
    .note-digit { font-size: 0.55rem; color: var(--text-muted); display: flex; justify-content: center; align-items: center; }

    .keypad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 8px; }
    .key-btn { aspect-ratio: 1; border-radius: 12px; border: none; background: #FFFFFF; font-size: 1.3rem; font-weight: 700; color: var(--text-dark); box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; }
    .key-btn:active { background: #EBF0FF; }

    .action-bar { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .action-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #D6E0EF; background: white; font-weight: 600; font-size: 0.8rem; color: var(--text-dark); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .action-btn.active { background: var(--text-dark); color: white; }

    .battle-header { display: flex; justify-content: space-between; align-items: center; background: #F8FAFC; padding: 10px 14px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #E2E8F0; }
    .player-card { display: flex; flex-direction: column; gap: 2px; }
    .player-name { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); }
    .player-score { font-size: 1.1rem; font-weight: 800; color: var(--text-dark); }
    .progress-bar-bg { width: 100%; height: 6px; background: #E2E8F0; border-radius: 3px; overflow: hidden; margin-top: 4px; }
    .progress-bar-fill { height: 100%; background: var(--accent-blue); width: 0%; transition: width 0.3s; }

    .powerups { display: flex; gap: 8px; margin-top: 8px; }
    .power-btn { flex: 1; padding: 8px; border-radius: 10px; border: none; font-weight: 700; font-size: 0.75rem; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .pw-freeze { background: #06B6D4; }
    .pw-shield { background: var(--accent-mint); }

    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 100; }
    .modal { background: white; width: 100%; max-width: 360px; border-radius: 20px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .hidden { display: none !important; }

    .frozen-screen { pointer-events: none; filter: blur(2px); opacity: 0.6; }
  </style>
</head>
<body>

<div class="app-container">
  <header>
    <div class="logo-title">🧩 Sudoku 1v1</div>
    <div class="mode-badge" id="modeBadge">Menu</div>
  </header>

  <!-- MAIN MENU -->
  <div id="menuScreen" class="card" style="display:flex; flex-direction:column; gap:12px;">
    <h2 style="text-align:center; margin-bottom:8px;">Choose Mode</h2>
    <button class="btn btn-primary" onclick="showRoomModal()">🎮 1v1 Online Private Room</button>
    <button class="btn btn-secondary" onclick="startMatch('ai')">🤖 1v1 VS Adaptive AI</button>
    <button class="btn btn-outline" onclick="startMatch('solo')">👤 Solo Practice Mode</button>
  </div>

  <!-- BATTLE SCREEN -->
  <div id="gameScreen" class="hidden">
    <!-- Battle Header -->
    <div id="duelHeader" class="battle-header hidden">
      <div class="player-card" style="width: 45%;">
        <span class="player-name">YOU</span>
        <span class="player-score" id="p1Score">0 pts</span>
        <div class="progress-bar-bg"><div id="p1Progress" class="progress-bar-fill"></div></div>
      </div>
      <span style="font-weight:800; color:var(--text-muted)">VS</span>
      <div class="player-card" style="width: 45%; text-align: right;">
        <span class="player-name" id="p2Name">OPPONENT</span>
        <span class="player-score" id="p2Score">0 pts</span>
        <div class="progress-bar-bg"><div id="p2Progress" class="progress-bar-fill" style="float:right; background:var(--accent-pink)"></div></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="action-bar">
      <button class="action-btn" onclick="eraseCell()">🧹<span>Erase</span></button>
      <button class="action-btn" id="notesBtn" onclick="toggleNotes()">✏️<span>Notes</span></button>
      <button class="action-btn" onclick="useHint()">💡<span>Hint</span></button>
    </div>

    <!-- Board -->
    <div class="sudoku-board" id="board"></div>

    <!-- Powerups -->
    <div id="powerupBar" class="powerups hidden">
      <button class="power-btn pw-freeze" onclick="usePowerup('freeze')">❄️ Freeze (10s)</button>
      <button class="power-btn pw-shield" onclick="usePowerup('shield')">🛡️ Shield</button>
    </div>

    <!-- Keypad -->
    <div class="keypad">
      <button class="key-btn" onclick="inputNumber(1)">1</button>
      <button class="key-btn" onclick="inputNumber(2)">2</button>
      <button class="key-btn" onclick="inputNumber(3)">3</button>
      <button class="key-btn" onclick="inputNumber(4)">4</button>
      <button class="key-btn" onclick="inputNumber(5)">5</button>
      <button class="key-btn" onclick="inputNumber(6)">6</button>
      <button class="key-btn" onclick="inputNumber(7)">7</button>
      <button class="key-btn" onclick="inputNumber(8)">8</button>
      <button class="key-btn" onclick="inputNumber(9)">9</button>
      <button class="key-btn" style="background:#EBF0FF;" onclick="eraseCell()">⌫</button>
    </div>
  </div>
</div>

<!-- ROOM MODAL -->
<div id="roomModal" class="overlay hidden">
  <div class="modal">
    <h3>1v1 Private Room</h3>
    <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
    <div style="font-size:0.8rem; color:var(--text-muted)">— OR —</div>
    <input type="text" id="roomInput" placeholder="Enter Room Code" style="width:100%; padding:12px; border-radius:10px; border:1px solid #CBD5E1; text-align:center; font-weight:700; text-transform:uppercase;">
    <button class="btn btn-secondary" onclick="joinRoom()">Join Room</button>
    <button class="btn btn-outline" onclick="closeRoomModal()">Cancel</button>
  </div>
</div>

<!-- WAITING MODAL -->
<div id="waitModal" class="overlay hidden">
  <div class="modal">
    <h3>Waiting for Opponent</h3>
    <p style="font-size:0.9rem; color:var(--text-muted)">Share this code with your friend:</p>
    <h1 id="roomCodeDisplay" style="letter-spacing: 4px; color:var(--accent-blue);">------</h1>
    <button class="btn btn-secondary" onclick="copyCode()">📋 Copy Code</button>
    <button class="btn btn-outline" onclick="location.reload()">Cancel</button>
  </div>
</div>

<script>
  let board = [], solution = [], initial = [], notes = Array.from({length:81}, ()=>[]);
  let selectedCell = null, isNotesMode = false, gameMode = 'solo';
  let p1Score = 0, p2Score = 0, p1Completed = 0, p2Completed = 0;
  let isFrozen = false, hasShield = false;
  let peer = null, conn = null;

  // Configuration for ICE/STUN servers to bypass mobile firewalls
  const peerConfig = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' }
      ]
    }
  };

  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  function playTone(freq, type="sine", duration=0.1) {
    try {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type; osc.frequency.value = freq;
      osc.connect(g); g.connect(ctx.destination);
      osc.start(); g.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    } catch(e){}
  }

  function initBoard() {
    const b = document.getElementById('board');
    b.innerHTML = '';
    for(let i=0; i<81; i++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if(Math.floor(i/9) === 2 || Math.floor(i/9) === 5) cell.classList.add('cell-row-end');
      cell.onclick = () => selectCell(i);
      b.appendChild(cell);
    }
  }

  function generateSudoku() {
    const sol = [
      5,3,4,6,7,8,9,1,2,
      6,7,2,1,9,5,3,4,8,
      1,9,8,3,4,2,5,6,7,
      8,5,9,7,6,1,4,2,3,
      4,2,6,8,5,3,7,9,1,
      7,1,3,9,2,4,8,5,6,
      9,6,1,5,3,7,2,8,4,
      2,8,7,4,1,9,6,3,5,
      3,4,5,2,8,6,1,7,9
    ];
    const init = [...sol];
    let removed = 40;
    while(removed > 0) {
      let idx = Math.floor(Math.random()*81);
      if(init[idx] !== 0) { init[idx] = 0; removed--; }
    }
    return { sol, init };
  }

  function startMatch(mode, p2Name = "Opponent") {
    gameMode = mode;
    document.getElementById('menuScreen').classList.add('hidden');
    document.getElementById('gameScreen').classList.remove('hidden');
    document.getElementById('modeBadge').innerText = mode.toUpperCase();

    if(mode !== 'p2p') {
      const data = generateSudoku();
      solution = data.sol; initial = [...data.init]; board = [...data.init];
    }

    if(mode !== 'solo') {
      document.getElementById('duelHeader').classList.remove('hidden');
      document.getElementById('powerupBar').classList.remove('hidden');
      document.getElementById('p2Name').innerText = p2Name;
    }

    renderBoard();
    if(mode === 'ai') startAILogic();
  }

  function renderBoard() {
    const cells = document.querySelectorAll('.cell');
    cells.forEach((cell, i) => {
      cell.classList.remove('given', 'user-filled', 'selected', 'same-num', 'related', 'incorrect');
      cell.innerHTML = '';

      if(initial[i] !== 0) {
        cell.classList.add('given');
        cell.innerText = initial[i];
      } else if(board[i] !== 0) {
        cell.classList.add('user-filled');
        cell.innerText = board[i];
        if(board[i] !== solution[i]) cell.classList.add('incorrect');
      } else if(notes[i].length > 0) {
        const grid = document.createElement('div');
        grid.className = 'notes-grid';
        for(let n=1; n<=9; n++) {
          const d = document.createElement('div');
          d.className = 'note-digit';
          d.innerText = notes[i].includes(n) ? n : '';
          grid.appendChild(d);
        }
        cell.appendChild(grid);
      }

      if(selectedCell === i) cell.classList.add('selected');
      else if(selectedCell !== null) {
        const selVal = board[selectedCell];
        if(selVal !== 0 && board[i] === selVal) cell.classList.add('same-num');
        const r1 = Math.floor(selectedCell/9), c1 = selectedCell%9;
        const r2 = Math.floor(i/9), c2 = i%9;
        if(r1 === r2 || c1 === c2) cell.classList.add('related');
      }
    });
  }

  function selectCell(i) {
    if(isFrozen) return;
    selectedCell = i;
    playTone(400, "sine", 0.05);
    renderBoard();
  }

  function inputNumber(num) {
    if(selectedCell === null || initial[selectedCell] !== 0 || isFrozen) return;

    if(isNotesMode) {
      const arr = notes[selectedCell];
      const idx = arr.indexOf(num);
      if(idx > -1) arr.splice(idx, 1);
      else arr.push(num);
    } else {
      board[selectedCell] = num;
      if(num === solution[selectedCell]) {
        playTone(600, "triangle", 0.1);
        p1Score += 50;
        p1Completed++;
        checkWin();
      } else {
        playTone(150, "sawtooth", 0.2);
        p1Score = Math.max(0, p1Score - 20);
      }
      syncP2P();
    }
    renderBoard();
    updateHeader();
  }

  function eraseCell() {
    if(selectedCell === null || initial[selectedCell] !== 0 || isFrozen) return;
    board[selectedCell] = 0;
    notes[selectedCell] = [];
    renderBoard();
  }

  function toggleNotes() {
    isNotesMode = !isNotesMode;
    document.getElementById('notesBtn').classList.toggle('active', isNotesMode);
  }

  function useHint() {
    if(selectedCell === null || initial[selectedCell] !== 0) return;
    board[selectedCell] = solution[selectedCell];
    p1Score = Math.max(0, p1Score - 10);
    renderBoard();
  }

  function updateHeader() {
    document.getElementById('p1Score').innerText = `${p1Score} pts`;
    document.getElementById('p1Progress').style.width = `${(p1Completed/41)*100}%`;
    document.getElementById('p2Score').innerText = `${p2Score} pts`;
    document.getElementById('p2Progress').style.width = `${(p2Completed/41)*100}%`;
  }

  function usePowerup(type) {
    if(type === 'freeze') {
      if(conn) conn.send({ type: 'FREEZE' });
      else if(gameMode === 'ai') alert("Freeze sent to AI!");
    } else if(type === 'shield') {
      hasShield = true;
      alert("Shield Active! Protected from next Freeze.");
    }
  }

  // ROOM MULTIPLAYER (PeerJS)
  function showRoomModal() { document.getElementById('roomModal').classList.remove('hidden'); }
  function closeRoomModal() { document.getElementById('roomModal').classList.add('hidden'); }

  function createRoom() {
    closeRoomModal();
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById('roomCodeDisplay').innerText = code;
    document.getElementById('waitModal').classList.remove('hidden');

    const data = generateSudoku();
    solution = data.sol; initial = [...data.init]; board = [...data.init];

    peer = new Peer(code, peerConfig);
    peer.on('connection', (c) => {
      conn = c;
      setupP2PConnection();
    });
  }

  function joinRoom() {
    const code = document.getElementById('roomInput').value.trim().toUpperCase();
    if(!code) return alert("Please enter a room code");
    closeRoomModal();

    peer = new Peer(peerConfig);
    peer.on('open', () => {
      conn = peer.connect(code, { reliable: true });
      setupP2PConnection();
    });
  }

  function setupP2PConnection() {
    conn.on('open', () => {
      document.getElementById('waitModal').classList.add('hidden');
      startMatch('p2p', 'Friend');

      // Send puzzle payload to joining device
      if(solution.length > 0) {
        conn.send({ type: 'START', sol: solution, init: initial });
      }
    });

    conn.on('data', (data) => {
      if(data.type === 'START') {
        solution = data.sol; initial = [...data.init]; board = [...data.init];
        document.getElementById('waitModal').classList.add('hidden');
        startMatch('p2p', 'Friend');
      } else if(data.type === 'SYNC') {
        p2Score = data.score;
        p2Completed = data.completed;
        updateHeader();
      } else if(data.type === 'FREEZE') {
        if(hasShield) {
          hasShield = false;
          alert("Your Shield blocked a Freeze attack!");
        } else {
          isFrozen = true;
          document.getElementById('board').classList.add('frozen-screen');
          setTimeout(() => {
            isFrozen = false;
            document.getElementById('board').classList.remove('frozen-screen');
          }, 10000);
        }
      }
    });
  }

  function syncP2P() {
    if(conn) conn.send({ type: 'SYNC', score: p1Score, completed: p1Completed });
  }

  function copyCode() {
    const code = document.getElementById('roomCodeDisplay').innerText;
    navigator.clipboard.writeText(code);
    alert("Room code copied!");
  }

  function startAILogic() {
    setInterval(() => {
      if(gameMode === 'ai' && p2Completed < 41) {
        p2Completed++;
        p2Score += 50;
        updateHeader();
      }
    }, 4000);
  }

  function checkWin() {
    if(p1Completed >= 41) {
      confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      alert("🎉 Victory! You won!");
    }
  }

  initBoard();
</script>
</body>
</html>
